# ═══════════════════════════════════════════════════════════════════════════════
#   КОНТЕНТ БОТА «ДЛЯ РІШУЧИХ»
# ═══════════════════════════════════════════════════════════════════════════════
#
# Тут усе, що бачить користувач: тексти, пакети, ціни, описи, посилання на оплату,
# нагадування та їхній розклад, назви кнопок і порядок їх відображення.
# Код бота для цього змінювати не потрібно.
#
# ЯК РЕДАГУВАТИ
#   • Змінюйте лише значення праворуч від двокрапки або текст під «|».
#     Назви полів ліворуч (offer:, price: тощо) не перекладайте і не видаляйте.
#   • Відступи — тільки пробілами (не Tab). Рядки одного рівня мають однаковий відступ.
#   • Короткий текст беріть у лапки: "Обрати пакет". Якщо в самому тексті є лапки "…",
#     використовуйте одинарні лапки зовні: 'Пакет "VIP"'.
#   • Довгий багаторядковий текст пишіть під «|», кожен рядок — з відступом.
#     Порожній рядок у такому тексті = порожній рядок у повідомленні.
#   • Рядки, що починаються з «#», — коментарі, бот їх ігнорує.
#   • Позначка ✏️ — місця, які треба замінити своїм текстом.
#
# ОФОРМЛЕННЯ (HTML Telegram)
#   <b>жирний</b>  <i>курсив</i>  <u>підкреслений</u>  <s>закреслений</s>
#   <a href="https://...">текст-посилання</a>   <blockquote>цитата</blockquote>
#   <tg-spoiler>прихований текст</tg-spoiler>   <code>моноширинний</code>
#   Тег <br> не підтримується — просто переходьте на новий рядок.
#   Символи < > & у звичайному тексті бот екранує сам.
#
# ПІДСТАНОВКИ — бот замінює їх автоматично:
#   {first_name}  ім'я користувача в Telegram
#   {time_left}   скільки залишилось до кінця пропозиції («23 год 15 хв»)
#   {deadline}    коли пропозиція завершиться («9 листопада о 14:35»)
#   Додаткові підстановки вказано в коментарях біля конкретних текстів.
#
# ПЕРЕВІРКА ФАЙЛУ:  python -m bot.check_content
#   На хостингу файл перевіряється автоматично під час збірки: якщо в ньому помилка,
#   нова версія не запуститься, а в журналі збірки буде написано, що саме не так.
# ═══════════════════════════════════════════════════════════════════════════════


# ─── НАЛАШТУВАННЯ ─────────────────────────────────────────────────────────────
settings:
  # Скільки діє пропозиція з моменту ПЕРШОГО /start.
  # Одиниці: д, год, хв, с (або d, h, m, s). Приклади: 24 год, 90 хв, 1 год 30 хв.
  # Зміна діє лише для нових користувачів: у тих, хто вже натиснув /start, таймер не змінюється.
  offer_duration: "24 год"

  # Часовий пояс для {deadline} і тихих годин.
  timezone: "Europe/Kyiv"

  # Як показувати {deadline}. Підстановки:
  #   {day} — число («9»), {month} — місяць числом («11»), {month_name} — «листопада»,
  #   {year} — «2026», {time} — «14:35», {date} — «09.11».
  deadline_format: "{day} {month_name} о {time}"

  # Як показувати {time_left}:
  #   auto — «23 год 5 хв», «3 год», «45 хв»;
  #   або свій шаблон: {h} — години, {m} — хвилини, {hh} і {mm} — з нулем попереду.
  #   Наприклад: "{hh}:{mm}" → «03:05».
  time_left_format: "auto"

  # Як часто оновлювати таймер у повідомленні з офером («живий» таймер).
  # 0 — не оновлювати (показувати залишок на момент надсилання).
  timer_update_every: "1 хв"

  # Що відбувається після завершення пропозиції:
  #   false — пакети й посилання на оплату більше не видаються, бот відповідає текстом messages.expired;
  #   true  — пакети доступні й далі (з price_after_expiry / payment_url_after_expiry, якщо вони вказані);
  #           тоді додайте кнопку в keyboards.expired:  - [choose_package]
  packages_after_expiry: false

  # true — у момент завершення пропозиції надіслати окреме повідомлення messages.expired_notice.
  # false — лише оновити таймер в офері на «час вийшов» (без окремого повідомлення).
  send_expired_notice: false

  # «Тихі години»: нагадування в цей час приходять вчасно, але без звуку.
  # Порожні лапки "" — вимкнено.
  silent_hours: "22:00-08:00"

  # Скільки кнопок пакетів показувати в одному рядку списку (1–8).
  packages_per_row: 1

  # Показувати прев'ю (картинку-попередній перегляд) для посилань у повідомленнях.
  link_previews: false

  # Опис команди /start у меню бота (кнопка «Меню» в Telegram).
  start_command_description: "Отримати пропозицію для рішучих"


# ─── ПОВІДОМЛЕННЯ ─────────────────────────────────────────────────────────────
messages:
  # Офер — надсилається після /start.
  # {timer} — рядок таймера (тексти timer і timer_expired нижче); бот оновлює його автоматично.
  offer: |
    Привіт, {first_name}! 👋

    ✏️ <i>Тут буде текст оферу. Замініть цей абзац своїм текстом.</i>

    🔥 <b>Пропозиція для рішучих. Діє 24 години</b>
    {timer}

  # Рядок таймера в офері, поки пропозиція діє. Підстановки: {time_left} {deadline}
  timer: "⏳ Залишилось: <b>{time_left}</b> (до {deadline})"

  # Рядок таймера в офері після завершення. Підстановки: {deadline}
  timer_expired: "⌛️ Час вийшов — пропозиція завершилась."

  # Список пакетів (кнопки з назвою і ціною додаються автоматично під повідомленням).
  # {packages} — необов'язково: перелік пакетів рядками у форматі package_line.
  packages_list: |
    Оберіть пакет 👇

  # Один рядок переліку {packages}. Підстановки: {number} {name} {price}
  package_line: "{number}. <b>{name}</b> — {price}"

  # Повідомлення з посиланням на оплату. Підстановки: {name} {price} {payment_url}
  payment: |
    💳 <b>Оплата пакета «{name}»</b> — {price}

    Посилання на оплату:
    {payment_url}

    Після оплати менеджер вручну відкриє вам доступ до курсу.
    ✏️ <i>Вкажіть, куди надіслати квитанцію про оплату, наприклад: @manager</i>

  # Відповідь, коли пропозиція вже завершилась (на /start і на кнопки пакетів).
  expired: |
    ⌛️ Пропозиція для рішучих уже завершилась.

    ✏️ <i>Якщо хочете долучитися до курсу — напишіть менеджеру: @manager</i>

  # Окреме повідомлення в момент завершення (лише якщо settings.send_expired_notice: true).
  expired_notice: |
    ⌛️ {first_name}, пропозиція для рішучих завершилась.

    ✏️ <i>Якщо хочете долучитися до курсу — напишіть менеджеру: @manager</i>

  # Відповідь на будь-яке інше повідомлення від користувача ("" — не відповідати).
  fallback: |
    Я автоматичний помічник і не читаю повідомлення 🙂
    Щоб обрати пакет, натисніть кнопку нижче.

    ✏️ <i>З питаннями пишіть менеджеру: @manager</i>

  # Коротке спливаюче повідомлення, якщо натиснули кнопку пакета, якого вже немає
  # (звичайний текст, до 200 символів).
  package_unavailable: "Цей пакет більше недоступний. Оберіть інший 👇"

  # Сповіщення менеджеру, коли користувач запросив посилання на оплату
  # (надсилається лише якщо задано змінну середовища MANAGER_CHAT_ID).
  # Підстановки: {user} — ім'я з посиланням на профіль, {username} — @логін (якщо є),
  # {user_id}, {package}, {price}, {time_left}, {deadline}
  manager_payment_request: |
    💳 <b>Запит посилання на оплату</b>
    Пакет: {package} — {price}
    Користувач: {user} {username}
    ID: <code>{user_id}</code>
    До кінця пропозиції: {time_left}


# ─── НАЗВИ КНОПОК ─────────────────────────────────────────────────────────────
buttons:
  choose_package: "Обрати пакет"
  other_packages: "Подивитися інші пакети"
  get_payment_link: "Отримати посилання на оплату"
  pay_url: "💳 Перейти до оплати"
  # Кнопка пакета у списку пакетів. Підстановки: {name} {price}
  package: "{name} — {price}"


# ─── ПОРЯДОК І РОЗМІЩЕННЯ КНОПОК ──────────────────────────────────────────────
# Кожен рядок «- [ … ]» — окремий ряд кнопок; кнопки в одному ряду — через кому,
# наприклад: - [get_payment_link, other_packages]
# Доступні кнопки:
#   choose_package, other_packages — відкрити список пакетів (різняться лише назвою);
#   get_payment_link — отримати посилання на оплату (лише в package);
#   pay_url — кнопка-посилання на сторінку оплати (лише в payment).
# Щоб прибрати всі кнопки з повідомлення, напишіть: назва: []
# Порядок самих пакетів у списку = порядок у розділі packages нижче.
keyboards:
  offer:          # під офером
    - [choose_package]
  package:        # під розширеним описом пакета
    - [get_payment_link]
    - [other_packages]
  payment:        # під повідомленням з посиланням на оплату
    - [pay_url]
    - [other_packages]
  reminder:       # під нагадуваннями
    - [choose_package]
  fallback:       # під відповіддю на довільне повідомлення
    - [choose_package]
  expired: []     # під повідомленням «пропозиція завершилась»


# ─── ПАКЕТИ ───────────────────────────────────────────────────────────────────
# Пакети показуються в тому порядку, в якому записані тут.
#   id          — коротка мітка латиницею: малі літери, цифри, _ і -.
#                 Не змінюйте id після запуску (на нього посилаються кнопки у вже надісланих повідомленнях).
#   name        — назва (звичайний текст, без HTML)
#   price       — ціна так, як її показувати («2 990 грн»)
#   description — розширений опис (HTML). Підстановки: {name} {price} {time_left} {deadline} {first_name}
#   payment_url — посилання на оплату саме цього пакета (https://…)
#   Необов'язково, лише для settings.packages_after_expiry: true —
#   price_after_expiry і payment_url_after_expiry: ціна і посилання після завершення пропозиції.
packages:
  - id: start
    name: "Старт"
    price: "1 990 грн"
    payment_url: "https://example.com/pay/start"
    description: |
      <b>Пакет «{name}» — {price}</b>

      ✏️ <i>Розширений опис пакета: для кого він, що входить, скільки триває навчання.</i>

      Що входить:
      ✅ Доступ до всіх відеоуроків курсу
      ✅ Робочі матеріали та шаблони
      ✅ Доступ на 3 місяці

      🎁 Бонус для рішучих: ✏️ <i>опишіть бонус</i>

  - id: optimal
    name: "Оптимальний"
    price: "3 990 грн"
    payment_url: "https://example.com/pay/optimal"
    description: |
      <b>Пакет «{name}» — {price}</b>

      ✏️ <i>Розширений опис пакета: для кого він, що входить, скільки триває навчання.</i>

      Що входить:
      ✅ Усе з пакета «Старт»
      ✅ Домашні завдання з перевіркою
      ✅ Закритий чат учасників
      ✅ Доступ на 6 місяців

      🎁 Бонус для рішучих: ✏️ <i>опишіть бонус</i>

  - id: vip
    name: "VIP"
    price: "7 990 грн"
    payment_url: "https://example.com/pay/vip"
    description: |
      <b>Пакет «{name}» — {price}</b>

      ✏️ <i>Розширений опис пакета: для кого він, що входить, скільки триває навчання.</i>

      Що входить:
      ✅ Усе з пакета «Оптимальний»
      ✅ Особисті консультації з автором
      ✅ Доступ назавжди

      🎁 Бонус для рішучих: ✏️ <i>опишіть бонус</i>


# ─── НАГАДУВАННЯ ──────────────────────────────────────────────────────────────
# Надсилаються лише поки пропозиція діє; після завершення — більше не надсилаються.
# Коли надіслати — одне з двох:
#   after:      через скільки після ПЕРШОГО /start   (наприклад, after: "2 год")
#   before_end: за скільки до кінця пропозиції       (наприклад, before_end: "1 год")
# Одиниці: д, год, хв, с (або d, h, m, s).
#   id   — унікальна мітка латиницею. Не змінюйте id нагадувань, які вже працюють:
#          нагадування з новим id прийде повторно тим, у кого пропозиція ще діє.
#   text — текст (HTML). Підстановки: {first_name} {time_left} {deadline}
# Під нагадуваннями — кнопки з keyboards.reminder.
# Щоб вимкнути нагадування, видаліть його або закоментуйте (# на початку кожного рядка).
reminders:
  - id: r1
    after: "2 год"
    text: |
      ⏰ {first_name}, нагадую: пропозиція для рішучих діє ще <b>{time_left}</b>.
      Оберіть пакет, поки діють бонусні умови 👇

  - id: r2
    after: "12 год"
    text: |
      ⏳ Минула половина часу. До кінця пропозиції для рішучих — <b>{time_left}</b>.
      Не відкладайте рішення на потім 👇

  - id: r3
    before_end: "3 год"
    text: |
      🔥 Залишилось лише <b>{time_left}</b> — потім бонусна пропозиція згорить.
      Встигніть обрати пакет 👇

  - id: r4
    before_end: "1 год"
    text: |
      ⚡️ Остання година! Пропозиція для рішучих діє до {deadline}.
      Залишилось <b>{time_left}</b> 👇
