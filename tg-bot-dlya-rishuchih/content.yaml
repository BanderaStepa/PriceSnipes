      📄 Шаблони: бриф, комерційна пропозиція, договір
      🔄 Оновлення курсу протягом року


# ─── НАГАДУВАННЯ ──────────────────────────────────────────────────────────────
# Надсилаються лише поки пропозиція діє; після завершення — більше не надсилаються.
# Коли надіслати — одне з двох:
#   after:      через скільки після ПЕРШОГО /start   (наприклад, after: "2 год")
#   before_end: за скільки до кінця пропозиції       (наприклад, before_end: "1 год")
# Одиниці: д, год, хв, с (або d, h, m, s).
#   id   — унікальна мітка латиницею. Не змінюйте id нагадувань, які вже працюють:
#          нагадування з новим id прийде повторно тим, у кого пропозиція ще діє.
#   text — текст (HTML). Підстановки: {first_name} {time_left} {deadline}
# Під нагадуваннями — кнопки з keyboards.reminder.
# Щоб вимкнути нагадування, видаліть його або закоментуйте (# на початку кожного рядка).
reminders:
  - id: r1
    after: "2 год"
    text: |
      🎁 {first_name}, встигни забрати курс «AI для реклами» у подарунок!
      Оплати будь-який пакет — і курс вартістю 14 900 грн отримаєш безкоштовно. Залишилось <b>{time_left}</b> 👇

  - id: r2
    after: "12 год"
    text: |
      ⏳ Половина часу вже минула!
      Курс «AI для реклами» у подарунок чекає на тебе ще <b>{time_left}</b> — встигни обрати пакет 👇

  - id: r3
    before_end: "3 год"
    text: |
      🔥 Залишилось лише <b>{time_left}</b>, щоб забрати курс «AI для реклами» у подарунок!
      Потім подарунок згорить — встигни 👇

  - id: r4
    before_end: "1 год"
    text: |
      ⚡️ Остання година! Встигни забрати курс «AI для реклами» у подарунок — пропозиція діє до {deadline}.
      Залишилось <b>{time_left}</b> 👇
