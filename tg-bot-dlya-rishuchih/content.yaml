# ─── НАЗВИ КНОПОК ─────────────────────────────────────────────────────────────
buttons:
  choose_package: "Обрати пакет"
  other_packages: "Подивитися інші пакети"
  get_payment_link: "Отримати посилання на оплату"
  pay_url: "💳 Перейти до оплати"
  gift: "🎁 Що за подарунок?"
  # Кнопка пакета у списку пакетів. Підстановки: {name} {price}
  package: "{name} — {price}"


# ─── ПОРЯДОК І РОЗМІЩЕННЯ КНОПОК ──────────────────────────────────────────────
# Кожен рядок «- [ … ]» — окремий ряд кнопок; кнопки в одному ряду — через кому,
# наприклад: - [get_payment_link, other_packages]
# Доступні кнопки:
#   choose_package, other_packages — відкрити список пакетів (різняться лише назвою);
#   get_payment_link — отримати посилання на оплату (лише в package);
#   pay_url — кнопка-посилання на сторінку оплати (лише в payment);
#   gift — опис подарунка (messages.gift); зникає, щойно пропозиція завершилась.
# Щоб прибрати всі кнопки з повідомлення, напишіть: назва: []
# Порядок самих пакетів у списку = порядок у розділі packages нижче.
keyboards:
  offer:          # під офером (у повідомленні з таймером)
    - [choose_package]
    - [gift]
  package:        # під розширеним описом пакета
    - [get_payment_link]
    - [other_packages]
  payment:        # під повідомленням з посиланням на оплату
    - [pay_url]
    - [other_packages]
  reminder:       # під нагадуваннями
    - [choose_package]
    - [gift]
  fallback:       # під відповіддю на довільне повідомлення
    - [choose_package]
    - [gift]
  gift:           # під описом подарунка
    - [choose_package]
  expired: []     # під повідомленням «пропозиція завершилась»


# ─── ПАКЕТИ ───────────────────────────────────────────────────────────────────
# Пакети показуються в тому порядку, в якому записані тут.
#   id          — коротка мітка латиницею: малі літери, цифри, _ і -.
#                 Не змінюйте id після запуску (на нього посилаються кнопки у вже надісланих повідомленнях).
#   name        — назва (звичайний текст, без HTML)
#   price       — ціна так, як її показувати («2 990 грн»)
#   description — розширений опис (HTML). Підстановки: {name} {price} {time_left} {deadline} {first_name}
#   payment_url — посилання на оплату саме цього пакета (https://…). Необов'язкове:
#                 без нього пакет інформаційний — кнопок оплати під описом немає.
#                 Додасте посилання — кнопка «Отримати посилання на оплату» з'явиться сама.
#   image       — картинка пакета (необов'язково): файл у папці images (.jpg, .png або .webp, до 10 МБ)
#                 або https-посилання. Бот надсилає її разом з описом: опис стає підписом під фото.
#                 Telegram дозволяє підпис до 1024 символів — довший опис прийде окремим повідомленням після фото.
#   Необов'язково, лише для settings.packages_after_expiry: true —
#   price_after_expiry і payment_url_after_expiry: ціна і посилання після завершення пропозиції.
packages:
  - id: start
    name: "⚡️ START"
    price: "3 900 грн"
    image: "images/start.jpg"
    payment_url: "https://secure.wayforpay.com/button/b0d339847fe31"
    description: |
