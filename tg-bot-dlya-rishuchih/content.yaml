# ═══════════════════════════════════════════════════════════════════════════════
#   КОНТЕНТ БОТА «ДЛЯ РІШУЧИХ»
# ═══════════════════════════════════════════════════════════════════════════════
#
# Тут усе, що бачить користувач: тексти, пакети, ціни, описи, посилання на оплату,
# нагадування та їхній розклад, назви кнопок і порядок їх відображення.
# Код бота для цього змінювати не потрібно.
#
# ЯК РЕДАГУВАТИ
#   • Змінюйте лише значення праворуч від двокрапки або текст під «|».
#     Назви полів ліворуч (offer:, price: тощо) не перекладайте і не видаляйте.
#   • Відступи — тільки пробілами (не Tab). Рядки одного рівня мають однаковий відступ.
#   • Короткий текст беріть у лапки: "Обрати пакет". Якщо в самому тексті є лапки "…",
#     використовуйте одинарні лапки зовні: 'Пакет "VIP"'.
#   • Довгий багаторядковий текст пишіть під «|», кожен рядок — з відступом.
#     Порожній рядок у такому тексті = порожній рядок у повідомленні.
#   • Рядки, що починаються з «#», — коментарі, бот їх ігнорує.
#   • Позначка ✏️ — місця, які треба замінити своїм текстом.
#
# ОФОРМЛЕННЯ (HTML Telegram)
#   <b>жирний</b>  <i>курсив</i>  <u>підкреслений</u>  <s>закреслений</s>
#   <a href="https://...">текст-посилання</a>   <blockquote>цитата</blockquote>
#   <blockquote expandable>«шторка»: згорнута цитата, розгортається натисканням</blockquote>
#   <tg-spoiler>спойлер: прихований текст, видно після натискання</tg-spoiler>
#   <code>моноширинний</code>
#   Тег <br> не підтримується — просто переходьте на новий рядок.
#   Символи < > & у звичайному тексті бот екранує сам.
#
# ПІДСТАНОВКИ — бот замінює їх автоматично:
#   {first_name}  ім'я користувача в Telegram
#   {time_left}   скільки залишилось до кінця пропозиції («23 год 15 хв»)
#   {deadline}    коли пропозиція завершиться («9 листопада о 14:35»)
#   Додаткові підстановки вказано в коментарях біля конкретних текстів.
#
# ПЕРЕВІРКА ФАЙЛУ:  python -m bot.check_content
#   На хостингу файл перевіряється автоматично під час збірки: якщо в ньому помилка,
#   нова версія не запуститься, а в журналі збірки буде написано, що саме не так.
# ═══════════════════════════════════════════════════════════════════════════════


# ─── НАЛАШТУВАННЯ ─────────────────────────────────────────────────────────────
settings:
  # Скільки діє пропозиція з моменту ПЕРШОГО /start.
  # Одиниці: д, год, хв, с (або d, h, m, s). Приклади: 24 год, 90 хв, 1 год 30 хв.
  # Зміна діє лише для нових користувачів: у тих, хто вже натиснув /start, таймер не змінюється.
  offer_duration: "24 год"

  # Часовий пояс для {deadline} і тихих годин.
  timezone: "Europe/Kyiv"

  # Як показувати {deadline}. Підстановки:
  #   {day} — число («9»), {month} — місяць числом («11»), {month_name} — «листопада»,
  #   {year} — «2026», {time} — «14:35», {date} — «09.11».
  deadline_format: "{day} {month_name} о {time}"

  # Як показувати {time_left}:
  #   auto — «23 год 5 хв», «3 год», «45 хв»;
  #   або свій шаблон: {h} — години, {m} — хвилини, {hh} і {mm} — з нулем попереду.
  #   Наприклад: "{hh}:{mm}" → «03:05».
  time_left_format: "auto"

  # Як часто оновлювати таймер у повідомленні з офером («живий» таймер).
  # 0 — не оновлювати (показувати залишок на момент надсилання).
  timer_update_every: "1 хв"

  # Що відбувається після завершення пропозиції:
  #   false — пакети й посилання на оплату більше не видаються, бот відповідає текстом messages.expired;
  #   true  — пакети доступні й далі (з price_after_expiry / payment_url_after_expiry, якщо вони вказані);
  #           тоді додайте кнопку в keyboards.expired:  - [choose_package]
  packages_after_expiry: false

  # true — у момент завершення пропозиції надіслати окреме повідомлення messages.expired_notice.
  # false — лише оновити таймер в офері на «час вийшов» (без окремого повідомлення).
  send_expired_notice: false

  # «Тихі години»: нагадування в цей час приходять вчасно, але без звуку.
  # Порожні лапки "" — вимкнено.
  silent_hours: "22:00-08:00"

  # Скільки кнопок пакетів показувати в одному рядку списку (1–8).
  packages_per_row: 1

  # Показувати прев'ю (картинку-попередній перегляд) для посилань у повідомленнях.
  link_previews: false

  # Опис команди /start у меню бота (кнопка «Меню» в Telegram).
  start_command_description: "Отримати пропозицію для рішучих"


# ─── ПОВІДОМЛЕННЯ ─────────────────────────────────────────────────────────────
