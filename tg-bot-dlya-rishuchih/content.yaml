      🧱 Структура сайту: вхід → довіра → офер → дія
      ✨ Перший робочий сайт з одного промпту
      🎨 Дизайн: палітра, шрифти, референси
      📱 Адаптив під телефон, планшет і комп'ютер
      🗂 GitHub: збереження та відновлення версій
      ☁️ Хостинг за 15 хвилин
      🌐 Домен: вибір і реєстрація
      🔒 Публікація: DNS, SSL, чек-лист перед запуском

  - id: standard
    name: "🚀 STANDARD"
    price: "5 500 грн"
    image: "images/standard.jpg"
    payment_url: "https://secure.wayforpay.com/button/beca6c5a85f19"
    description: |
