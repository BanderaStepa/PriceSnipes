      Усе зі Start ➕ інструменти, щоб сайт продавав.

      🧩 50 скілів для коду: секції, анімації, форми, адаптив
      🗃 3 артефакти-референси:
         🛒 інтернет-магазин
         🖼 сайт-портфоліо
         💼 сайт-візитка
      ✍️ Продаючі тексти: біль → рішення → доказ → дія
      ⭐️ Відгуки та соцдоказ
      🎞 Анімації та мікровзаємодії
      🔎 SEO-основа: мета-теги, превʼю, sitemap
      🧠 Як працюють LLM + бібліотека промптів

  - id: automation
    name: "⚙️ AUTOMATION"
    price: "7 700 грн"
    image: "images/automation.jpg"
    payment_url: "https://secure.wayforpay.com/button/be06d4f76684c"
    description: |
      <b>{name} — {price}</b>

      Усе зі Standard ➕ сайт, який сам збирає й обробляє заявки.

      📝 Лід-форми: поля, тексти, розміщення
      🔗 Автоматизації: Make, Zapier, n8n
      📬 Заявки одразу на пошту, в Telegram і в таблицю
      💌 Автовідповідь клієнту після заявки
      📅 Онлайн-запис і бронювання на сайті
      📊 CRM: ліди, статуси, нагадування
      💬 AI-агент підтримки 24/7
      🤝 AI-менеджер, який кваліфікує ліда до заявки

  - id: pro
    name: "💳 PRO"
    price: "9 200 грн"
    image: "images/pro.jpg"
    payment_url: "https://secure.wayforpay.com/button/b3da0cc78e969"
    description: |
      <b>{name} — {price}</b>

      Усе з Automation ➕ оплати, аналітика й реклама.

      💰 Оплата та еквайринг без розробника
      ✅ Після оплати: сторінка подяки, лист, запис у CRM
      📈 Ключові показники та щотижневі метрики
      🎯 Meta Pixel + CAPI: події та серверний трекінг
      🏷 UTM-мітки: джерело кожної заявки
